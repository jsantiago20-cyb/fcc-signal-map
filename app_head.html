<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cellular Signal Map</title>
<style>
:root{
  color-scheme: light;
  --ground:#eef0ec; --surface:#f9faf8; --inset:#e4e8e2; --rule:#ccd2cc; --rule-soft:#dde2dc;
  --ink:#111619; --ink-2:#5c656b; --ink-3:#8a938f;
  --ramp-1:#86b6ef; --ramp-2:#5598e7; --ramp-3:#2a78d6; --ramp-4:#184f95;
  --none:#d8d2c6; --accent:#eb6834;
  --terrain-op:.60; --terrain-blend:multiply; --hex-op:.72;
  --county:#5c656b; --county-op:.5;
  --road-major:#2f3438; --road-minor:#6b7378; --trail:#8a5a2b; --trail-min:#a8804f; --river:#3d7ea6;
  --focus:#2a78d6; --tagink:#ffffff; --err:#b3261e;
  --upx:0.12;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#12161a; --surface:#1a1f24; --inset:#232930; --rule:#2b3238; --rule-soft:#222930;
    --ink:#e9eef1; --ink-2:#98a3ab; --ink-3:#6c767e;
    --ramp-1:#184f95; --ramp-2:#2a78d6; --ramp-3:#5598e7; --ramp-4:#9ec5f4;
    --none:#3b3830; --accent:#eb6834;
    --terrain-op:.38; --terrain-blend:screen; --hex-op:.70;
    --county:#98a3ab; --county-op:.42;
    --road-major:#e2e8ec; --road-minor:#8e979d; --trail:#d09a5e; --trail-min:#9c7346; --river:#4f9ac4;
    --focus:#5598e7; --tagink:#0d1b2e; --err:#f2b8b5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#12161a; --surface:#1a1f24; --inset:#232930; --rule:#2b3238; --rule-soft:#222930;
  --ink:#e9eef1; --ink-2:#98a3ab; --ink-3:#6c767e;
  --ramp-1:#184f95; --ramp-2:#2a78d6; --ramp-3:#5598e7; --ramp-4:#9ec5f4;
  --none:#3b3830; --accent:#eb6834;
  --terrain-op:.38; --terrain-blend:screen; --hex-op:.70;
  --county:#98a3ab; --county-op:.42;
  --road-major:#e2e8ec; --road-minor:#8e979d; --trail:#d09a5e; --trail-min:#9c7346; --river:#4f9ac4;
  --focus:#5598e7; --tagink:#0d1b2e; --err:#f2b8b5;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.cond{font-family:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Roboto Condensed","Segoe UI",system-ui,sans-serif}
.mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Roboto Mono",monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:600}

.wrap{max-width:1420px; margin:0 auto; padding:26px 22px 60px}

header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:18px 28px;
  border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:18px}
h1{margin:0; font-size:clamp(28px,4.4vw,46px); line-height:.98; font-weight:700;
  letter-spacing:-.01em; text-wrap:balance}
.sub{color:var(--ink-2); font-size:14px; max-width:50ch; margin:6px 0 0}
.stamp{margin-left:auto; text-align:right; font-size:12px; line-height:1.7; color:var(--ink-2)}
.stamp b{color:var(--ink); font-weight:600}

.controls{display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end; margin-bottom:14px}
.ctl{display:flex; flex-direction:column; gap:6px}
.seg{display:flex; flex-wrap:wrap; gap:2px; background:var(--inset); padding:3px; border-radius:3px}
.seg button{
  font:inherit; font-size:13px; font-weight:600; letter-spacing:.01em;
  border:0; background:transparent; color:var(--ink-2); padding:6px 12px;
  border-radius:2px; cursor:pointer; white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg button:focus-visible, select:focus-visible, input:focus-visible, .zbtn:focus-visible,
.gobtn:focus-visible, a:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.chk:focus-within{outline:2px solid var(--focus); outline-offset:3px; border-radius:2px}
select, input[type=text]{font:inherit; font-size:13px; padding:7px 10px; background:var(--surface);
  color:var(--ink); border:1px solid var(--rule); border-radius:3px}
.layers{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
.chk{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-2); cursor:pointer}
.chk input{accent-color:var(--ramp-3); margin:0; cursor:pointer}

.find{display:flex; gap:6px; align-items:stretch}
.find input{width:262px}
.gobtn{font:inherit; font-size:13px; font-weight:600; padding:7px 14px; cursor:pointer;
  background:var(--ink); color:var(--ground); border:0; border-radius:3px}
.gobtn:hover{opacity:.86}
.findmsg{font-size:12px; margin-top:4px; min-height:15px; color:var(--ink-3); max-width:62ch}
.findmsg.bad{color:var(--err)}

.main{display:grid; grid-template-columns:minmax(0,1fr) 336px; gap:22px; align-items:start}
@media (max-width:960px){ .main{grid-template-columns:minmax(0,1fr)} .rail{position:static} }

.mapcard{background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:12px;
  max-width:min(100%, 78vh); margin-inline:auto; position:relative}
.mapbox{position:relative; touch-action:none}
svg.map{display:block; width:100%; height:auto; cursor:grab}
svg.map.drag{cursor:grabbing}

.zoomui{position:absolute; top:9px; left:9px; display:flex; flex-direction:column; gap:4px; z-index:2}
.zbtn{width:30px; height:30px; font:inherit; font-size:16px; font-weight:600; line-height:1;
  background:var(--surface); color:var(--ink); border:1px solid var(--rule); border-radius:3px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
.zbtn:hover{background:var(--inset)}
.zbtn.rst{font-size:10px; letter-spacing:.04em}
.zlvl{position:absolute; top:9px; right:9px; z-index:2; font-size:11px; padding:3px 8px;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px; color:var(--ink-2)}

.hex{stroke:none}
#hexes{opacity:var(--hex-op)}
#terrain{opacity:var(--terrain-op); mix-blend-mode:var(--terrain-blend)}
.countyline{fill:none; stroke:var(--county); stroke-width:calc(1.1px * var(--upx));
  opacity:var(--county-op); stroke-linejoin:round}
.ring{fill:none; stroke:var(--accent); stroke-width:calc(1.7px * var(--upx));
  stroke-dasharray:calc(7px * var(--upx)) calc(5px * var(--upx)); opacity:.9}
#l-hw0 path{fill:none; stroke:var(--road-major); stroke-width:calc(1.75px * var(--upx));
  stroke-linecap:round; stroke-linejoin:round}
#l-hw1 path{fill:none; stroke:var(--road-major); stroke-width:calc(1.2px * var(--upx));
  stroke-linecap:round; stroke-linejoin:round; opacity:.9}
#l-rd path{fill:none; stroke:var(--road-minor); stroke-width:calc(.8px * var(--upx));
  stroke-linecap:round; stroke-linejoin:round}
#l-trmaj path{fill:none; stroke:var(--trail); stroke-width:calc(1.35px * var(--upx));
  stroke-dasharray:calc(4px * var(--upx)) calc(2.6px * var(--upx)); stroke-linecap:round}
#l-trmin path{fill:none; stroke:var(--trail-min); stroke-width:calc(.75px * var(--upx));
  stroke-dasharray:calc(2.6px * var(--upx)) calc(2.2px * var(--upx)); stroke-linecap:round; opacity:.8}
#l-riv path{fill:none; stroke:var(--river); stroke-width:calc(1.05px * var(--upx));
  stroke-linecap:round; stroke-linejoin:round; opacity:.85}
.placedot{fill:var(--ink); opacity:.75; r:calc(2.4px * var(--upx))}
.placelbl{font-size:calc(11px * var(--upx)); fill:var(--ink); paint-order:stroke;
  stroke:var(--surface); stroke-width:calc(2.8px * var(--upx)); stroke-linejoin:round;
  font-weight:600; letter-spacing:.02em}
.ctrdot{fill:var(--accent); stroke:var(--surface); stroke-width:calc(1.6px * var(--upx));
  r:calc(5px * var(--upx))}
.sel{fill:none; stroke:var(--ink); stroke-width:calc(1.6px * var(--upx)); pointer-events:none}
.sel.pin{stroke:var(--accent); stroke-width:calc(2.2px * var(--upx))}
.qmark{fill:none; stroke:var(--accent); stroke-width:calc(1.8px * var(--upx)); pointer-events:none}
.scale text, .compass text{font-size:calc(11px * var(--upx)); fill:var(--ink-2); font-weight:600;
  letter-spacing:.05em; paint-order:stroke; stroke:var(--surface); stroke-width:calc(2.4px * var(--upx));
  stroke-linejoin:round}
.scale line, .scale path{stroke:var(--ink-2); stroke-width:calc(1.3px * var(--upx)); fill:none}
.compass path{fill:var(--ink-2); stroke:var(--surface); stroke-width:calc(1.2px * var(--upx))}
.tier1, .tier2{display:none}
svg.z2 .tier1{display:inline}
svg.z3 .tier1, svg.z3 .tier2{display:inline}

.legend{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin-top:12px;
  padding-top:11px; border-top:1px solid var(--rule-soft)}
.lgitem{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
.sw{width:15px; height:15px; border-radius:2px; flex:none}
.lgline{width:19px; height:0; border-top-width:2px; border-top-style:solid; flex:none}

.rail{display:flex; flex-direction:column; gap:14px; position:sticky; top:18px}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:14px 15px}
.panel h2{margin:0 0 10px; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600}
.coord{font-size:15px; font-weight:600; letter-spacing:.01em}
.hint{color:var(--ink-3); font-size:13px; margin:0}

.dist{display:flex; gap:2px; height:26px; margin:2px 0 10px}
.dist span{border-radius:1px; min-width:2px}
.distkey{display:flex; flex-direction:column; gap:5px; font-size:12.5px}
.distkey div{display:flex; align-items:center; gap:7px}
.distkey b{margin-left:auto; font-weight:600}

table.pt{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px}
table.pt th{text-align:left; font-weight:600; color:var(--ink-3); font-size:10.5px;
  letter-spacing:.09em; text-transform:uppercase; padding:0 0 5px; border-bottom:1px solid var(--rule)}
table.pt th.num, table.pt td.num{text-align:right}
table.pt td{padding:6px 0; border-bottom:1px solid var(--rule-soft); vertical-align:top}
table.pt tr:last-child td{border-bottom:0}
.tag{display:inline-block; padding:1px 6px; border-radius:2px; font-size:11px; font-weight:600;
  letter-spacing:.02em; white-space:nowrap}
.tag.off{background:var(--none); color:var(--ink-2)}
.weak{color:var(--ink-3)}
.fcclink{display:inline-block; margin-top:10px; font-size:12.5px; color:var(--ramp-3);
  text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:1px}
.fcclink:hover{color:var(--ink)}

.stats{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.stat{background:var(--inset); border-radius:3px; padding:9px 11px}
.stat .v{font-size:24px; font-weight:700; line-height:1.1; letter-spacing:-.01em}
.stat .l{font-size:11px; color:var(--ink-2); line-height:1.35; margin-top:3px}

details{margin-top:22px; background:var(--surface); border:1px solid var(--rule); border-radius:4px}
summary{cursor:pointer; padding:13px 16px; font-weight:600; font-size:14px; list-style:none;
  display:flex; align-items:center; gap:9px}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8"; color:var(--ink-3); font-size:12px}
details[open] summary::before{content:"\25BE"}
summary:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
.tblwrap{overflow-x:auto; padding:0 16px 16px}
table.full{width:100%; border-collapse:collapse; font-size:13px; min-width:640px}
table.full th{text-align:left; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:7px 12px 7px 0; border-bottom:1px solid var(--rule); white-space:nowrap}
table.full td{padding:8px 12px 8px 0; border-bottom:1px solid var(--rule-soft)}
table.full th.num, table.full td.num{text-align:right; padding-right:0}
table.full tr:last-child td{border-bottom:0}
.bar{display:inline-block; height:9px; border-radius:1px; background:var(--ramp-3); vertical-align:middle}

.notes{margin-top:22px; font-size:13px; color:var(--ink-2); line-height:1.65;
  border-top:1px solid var(--rule); padding-top:16px}
.notes h3{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
  margin:0 0 8px; font-weight:600}
.notes p{margin:0 0 9px; max-width:78ch}
.notes a{color:var(--ramp-3)}
.notes code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:12px;
  background:var(--inset); padding:1px 5px; border-radius:2px}

/* survey picker + empty / loading states */
.surveys{display:flex; flex-wrap:wrap; gap:6px}
.spill{font:inherit; font-size:12.5px; font-weight:600; padding:5px 11px; cursor:pointer;
  background:var(--inset); color:var(--ink-2); border:1px solid transparent; border-radius:99px}
.spill:hover{color:var(--ink)}
.spill[aria-pressed="true"]{background:var(--surface); color:var(--ink); border-color:var(--rule)}
.state{padding:44px 26px; text-align:center; color:var(--ink-2)}
.state h3{margin:0 0 8px; font-size:19px; color:var(--ink); font-weight:700}
.state p{margin:0 auto 12px; max-width:56ch; font-size:14px}
.state code{display:block; margin:14px auto; max-width:60ch; text-align:left; font-size:12.5px;
  background:var(--inset); padding:11px 13px; border-radius:3px; overflow-x:auto; white-space:pre;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; color:var(--ink)}
.state .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px}
.state a.btn{font-size:13px; font-weight:600; padding:8px 15px; border-radius:3px;
  text-decoration:none; background:var(--ink); color:var(--ground)}
.state a.btn.alt{background:transparent; color:var(--ink); border:1px solid var(--rule)}
.spin{display:inline-block; width:15px; height:15px; border:2px solid var(--rule);
  border-top-color:var(--ramp-3); border-radius:50%; animation:sp .8s linear infinite;
  vertical-align:-3px; margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none !important}

@media (prefers-reduced-motion:reduce){ .spin{animation:none} }
@media (prefers-reduced-motion:no-preference){ .hex{transition:fill .16s ease} }
</style>
